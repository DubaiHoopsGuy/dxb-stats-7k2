name: Update data

on:
  schedule:
    - cron: "*/20 * * * *"   # every 20 minutes (GitHub may run it a little late)
  workflow_dispatch:          # adds a "Run workflow" button

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download new games and rebuild data.json
        run: python fetch_data.py
      - name: Save changes
        run: |
          git config user.name "data-bot"
          git config user.email "data-bot@users.noreply.github.com"
          git add data.json raw
          git diff --cached --quiet || (git commit -m "Update data $(date -u +%Y-%m-%dT%H:%MZ)" && git push)
