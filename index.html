<html lang="en">

<style>
:root{
  --bg:#f3f5f8; --card:#ffffff; --ink:#15202b; --muted:#5d6a78; --rule:#dfe4ea;
  --bar:#0f2a35; --bar-ink:#ffffff; --bar-muted:#a9c3cd; --dub:#1f6f8b;
  --g2:#1b6e8a; --g2-ink:#ffffff; --g1:#cde6ee; --g1-ink:#0f3d4d;
  --n:#e9edf1; --n-ink:#15202b; --opp:#c98200;
  --b1:#f8dcc4; --b1-ink:#6b3510; --b2:#c4531c; --b2-ink:#ffffff;
  --font:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  color-scheme:light;
  box-sizing:border-box; padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#0d151c; --card:#16212b; --ink:#e7edf2; --muted:#9aa8b6; --rule:#263340;
    --bar:#0a1e27; --bar-ink:#ffffff; --bar-muted:#8fb0bc; --dub:#62b6d1;
    --g2:#2f8fb0; --g2-ink:#ffffff; --g1:#173c4a; --g1-ink:#bfe3ef;
    --n:#1e2a35; --n-ink:#e7edf2;
    --opp:#f0b440; --b1:#4a2b17; --b1-ink:#f6c9a5; --b2:#d8662c; --b2-ink:#ffffff; color-scheme:dark;}
}
:root[data-theme="dark"]{--bg:#0d151c; --card:#16212b; --ink:#e7edf2; --muted:#9aa8b6; --rule:#263340;
  --bar:#0a1e27; --bar-ink:#ffffff; --bar-muted:#8fb0bc; --dub:#62b6d1;
  --g2:#2f8fb0; --g2-ink:#ffffff; --g1:#173c4a; --g1-ink:#bfe3ef;
  --n:#1e2a35; --n-ink:#e7edf2;
  --opp:#f0b440; --b1:#4a2b17; --b1-ink:#f6c9a5; --b2:#d8662c; --b2-ink:#ffffff; color-scheme:dark;}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.4;-webkit-text-size-adjust:100%;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bar)}
.app{max-width:640px;margin:0 auto;min-height:100%}
:focus-visible{outline:3px solid var(--dub);outline-offset:2px}

/* top bar */
.frozen{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);box-shadow:0 1px 0 var(--rule),0 6px 10px -8px rgba(0,0,0,.35)}
.heads{padding-bottom:6px}
.bar{background:var(--bar);color:var(--bar-ink);padding:10px 14px 12px}
.match{display:flex;align-items:center;gap:10px}
.nextl{font-size:.8rem;color:var(--bar-muted);margin-top:4px}
.match .teams{font-size:1.3rem;font-weight:750;letter-spacing:-.01em;display:flex;align-items:center;gap:6px;flex-wrap:nowrap;min-width:0}
.match .teams select{min-width:0;max-width:11rem;text-overflow:ellipsis}
.match select{font:inherit;font-weight:750;color:var(--bar-ink);background:transparent;border:0;border-bottom:2px dashed var(--bar-muted);padding:0 2px;appearance:none;-webkit-appearance:none;cursor:pointer}
.match select option{color:#15202b}
.match .state{margin-left:auto;text-align:right;font-variant-numeric:tabular-nums;line-height:1.2}
.match .state b{display:block;font-size:1.35rem}
.match .state span{font-size:.8rem;color:var(--bar-muted)}
.live-dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#ff4d4d;margin-right:5px;vertical-align:1px;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.3}}
.seg{display:flex;background:rgba(255,255,255,.12);border-radius:10px;padding:3px;margin-top:10px}
.seg button{flex:1;font:inherit;font-size:.9rem;font-weight:600;color:var(--bar-muted);background:none;border:0;border-radius:8px;padding:7px 0;min-height:36px;cursor:pointer}
.seg button[aria-pressed=true]{background:var(--bar-ink);color:var(--bar)}

/* alert strip */
.alert{margin:10px 10px 0;background:var(--b2);color:var(--b2-ink);border-radius:10px;padding:8px 12px;font-size:.88rem;font-weight:600;display:flex;gap:8px;align-items:center}
.alert.ok{background:var(--g2);color:var(--g2-ink)}

/* grid */
.grid{display:grid;grid-template-columns:1fr 1fr 10px 1fr 1fr;gap:6px;padding:10px 10px 0}
.gh{font-size:.78rem;font-weight:700;text-align:center;padding:2px 0 0;border-bottom:2px solid var(--ink)}
.gh.o{grid-column:1/3} .gh.d{grid-column:4/6}
.ch{font-size:.72rem;color:var(--muted);text-align:center;line-height:1.15;padding-bottom:2px}
.gap{grid-column:3}
.rl{grid-column:1/-1;font-size:.78rem;font-weight:700;color:var(--muted);margin:6px 0 -3px 2px}
.tile{font:inherit;border:0;border-radius:10px;padding:8px 4px 7px;min-height:56px;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-variant-numeric:tabular-nums;transition:transform .08s}
.tile:active{transform:scale(.96)}
.tile .v{font-size:1.08rem;font-weight:700;line-height:1.1}
.tile .r{font-size:.72rem;opacity:.85;line-height:1.1}
.t2{background:var(--g2);color:var(--g2-ink)} .t1{background:var(--g1);color:var(--g1-ink)}
.t0{background:var(--n);color:var(--n-ink)}
.t-1{background:var(--b1);color:var(--b1-ink)} .t-2{background:var(--b2);color:var(--b2-ink)}
.tile.flat{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}

.key{display:flex;align-items:center;gap:6px;justify-content:center;font-size:.75rem;color:var(--muted);padding:14px 10px 4px}
.key i{display:inline-block;width:22px;height:12px;border-radius:3px}
.foot{font-size:.72rem;color:var(--muted);text-align:center;padding:4px 16px 24px}

.back{font:inherit;font-weight:600;color:var(--bar-ink);background:none;border:0;padding:4px 0;min-height:36px;cursor:pointer;font-size:.95rem}

/* drill-down */
.dbar{padding-bottom:8px}
.dtitle{font-size:1.25rem;font-weight:750;margin:2px 0 0}
.seg.four button{font-size:.78rem;padding:6px 2px;line-height:1.15}
.chips{display:flex;gap:6px;overflow-x:auto;padding:8px 10px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:0 0 auto;font:inherit;font-size:.8rem;font-weight:600;color:var(--ink);background:var(--card);border:1px solid var(--rule);border-radius:999px;padding:6px 12px;min-height:34px;cursor:pointer;white-space:nowrap}
.chips button[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.sec{padding:0 10px;margin:16px 0 0}
.sec h3{font-size:.95rem;margin:0 0 8px;font-weight:750}
.hero{display:grid;grid-template-columns:1.1fr 1fr;gap:8px}
.hero .tile{min-height:96px;cursor:default}
.hero .tile .v{font-size:2rem}
.hero .tile .r{font-size:.85rem}
.refs{display:flex;flex-direction:column;gap:8px}
.ref{background:var(--card);box-shadow:inset 0 0 0 1px var(--rule);border-radius:10px;padding:8px 12px;font-variant-numeric:tabular-nums;flex:1;display:flex;flex-direction:column;justify-content:center}
.ref b{font-size:1.1rem} .ref span{font-size:.75rem;color:var(--muted)}
.card{background:var(--card);box-shadow:inset 0 0 0 1px var(--rule);border-radius:12px;padding:10px}
.chart svg{display:block;width:100%;height:auto}
.chart text{font-family:var(--font);font-size:11px;fill:var(--muted)}
.chart text.val{fill:var(--ink);font-weight:700;font-size:11.5px}
.f2{fill:var(--g2)} .f1{fill:var(--g1)} .f0{fill:var(--n)} .f-1{fill:var(--b1)} .f-2{fill:var(--b2)} .fN{fill:var(--n)}
.chart line,.chart text{pointer-events:none}
.chart .refl{stroke:var(--muted);stroke-dasharray:4 4}
.chart .refl2{stroke:var(--ink);stroke-dasharray:1 3;stroke-width:1.5}
.readout{font-size:.82rem;color:var(--muted);min-height:1.3em;margin:6px 2px 0;font-variant-numeric:tabular-nums}
.readout b{color:var(--ink)}
.rows{display:flex;flex-direction:column;gap:6px}
.crow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;background:var(--card);box-shadow:inset 0 0 0 1px var(--rule);border-radius:10px;padding:8px 10px;font-variant-numeric:tabular-nums}
.crow .l{font-size:.88rem}
.crow .x{font-size:.78rem;color:var(--muted)}
.chip{display:inline-block;min-width:4.2rem;text-align:center;border-radius:8px;padding:4px 8px;font-weight:700;font-size:.9rem}
.lg{display:flex;flex-direction:column;gap:2px}
.lrow{display:grid;grid-template-columns:1.6rem 6.6rem 1fr 3.6rem;gap:6px;align-items:center;font-size:.8rem;font-variant-numeric:tabular-nums;padding:2px 4px;border-radius:6px}
.lrow .n{color:var(--muted);text-align:right}
.lrow .b{height:9px;border-radius:4px;background:var(--dub);opacity:.7}
.lrow.me .b{opacity:1}
.chart .sel{stroke:var(--ink);stroke-width:2.5}
.gp{margin-top:10px;border-top:1px solid var(--rule);padding-top:10px}
.gp .gt{font-weight:750;font-size:.95rem;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.why{font-size:.82rem;margin:6px 0 8px;display:flex;flex-direction:column;gap:2px}
.why b{font-weight:700}
.frow{width:100%;font:inherit;color:inherit;background:none;border:0;border-top:1px solid var(--rule);text-align:left;display:grid;grid-template-columns:3.3rem 3.4rem 3.4rem 2.8rem minmax(3rem,1fr) .6rem;gap:6px;align-items:center;font-variant-numeric:tabular-nums;font-size:.85rem;padding:5px 0;border-top:1px solid var(--rule)}
.frow.hd{font-size:.7rem;color:var(--muted);border-top:0;padding:0}
.frow .s{font-weight:700}
.frow .a{color:var(--muted);text-align:right}
.frow .chip{min-width:0;width:100%;font-size:.85rem;padding:3px 4px}
.div{display:block;position:relative;height:22px;background:var(--n);border-radius:6px;overflow:hidden}
.div::after{content:"";position:absolute;left:50%;top:0;bottom:0;width:1.5px;background:var(--muted)}
.div i{position:absolute;top:3px;bottom:3px;border-radius:4px}
.seg2{display:flex;background:var(--n);border-radius:9px;padding:3px;margin:0 0 10px}
.seg2 button{flex:1;font:inherit;font-size:.8rem;font-weight:600;color:var(--muted);background:none;border:0;border-radius:7px;padding:6px 4px;min-height:34px;cursor:pointer}
.seg2 button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.18)}
.ffrow{width:100%;font:inherit;color:inherit;background:none;border:0;border-top:1px solid var(--rule);text-align:left;display:grid;grid-template-columns:3.3rem 3.8rem 2.6rem 1fr .6rem;gap:6px;align-items:center;padding:6px 0;cursor:pointer;font-variant-numeric:tabular-nums}
.ffrow:hover{background:var(--n)}
.ffrow.hd{border-top:0;padding:0 0 4px;font-size:.7rem;color:var(--muted);cursor:default}
.ffrow.hd:hover{background:none}
.ffrow .s{font-weight:700;font-size:.9rem}
.ffrow .s small{display:block;font-size:.66rem;font-weight:500;color:var(--muted)}
.ffrow .chip{min-width:0;width:100%;font-size:.88rem;padding:4px}
.ffrow .rk{font-weight:800;font-size:1.05rem;text-align:center}
.ffrow .chev{color:var(--muted);font-size:1.1rem;text-align:right}
.ends{display:flex;justify-content:space-between}
.strip{display:grid;grid-template-columns:repeat(20,1fr);gap:2px;align-items:center;height:22px}
.strip i{display:block;height:8px;border-radius:2px;background:var(--n)}
.strip i.me{height:22px;border-radius:4px;box-shadow:0 0 0 1.5px var(--ink)}
.strip i.me.t2{background:var(--g2)} .strip i.me.t1{background:var(--g1)} .strip i.me.t0{background:var(--n)} .strip i.me.t-1{background:var(--b1)} .strip i.me.t-2{background:var(--b2)}
.gnav{display:flex;align-items:center;gap:6px}
.gnav .dtitle{flex:1;font-size:1.1rem}
.rnav{font:inherit;font-size:1.4rem;line-height:1;color:var(--bar-ink);background:rgba(255,255,255,.12);border:0;border-radius:8px;width:36px;height:36px;cursor:pointer}
.rnav:disabled{opacity:.3;cursor:default}
.gsub{font-size:.8rem;color:var(--bar-muted);margin-top:2px}
.g3{display:grid;grid-template-columns:1fr 1fr 1.25fr;gap:8px}
.g3 .tile{cursor:default;min-height:64px}
.g3 .tile .v{font-size:1.35rem}
.gro{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 12px;min-height:2.6em;font-variant-numeric:tabular-nums;font-size:.85rem;padding:0 2px 6px}
.gro .gt2{font-weight:700;min-width:4.6rem}
.gro .gv b{font-size:1rem}
.gro .gv small{color:var(--muted)}
.gro .gshot{color:var(--muted);flex-basis:100%;font-size:.8rem}
.ln{display:inline-block;width:14px;height:3px;border-radius:2px;margin-right:5px;vertical-align:middle}
.ln.dash{background:none;border-top:2px dashed var(--muted);height:0}
.glegend{display:flex;flex-wrap:wrap;gap:4px 14px;font-size:.74rem;color:var(--muted);margin-top:6px}
.glegend .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--dub);margin-right:4px;vertical-align:middle}
.glegend .dot.o{background:none;box-shadow:inset 0 0 0 1.5px var(--dub)}
.gchart svg{font-family:var(--font)}
.gchart .gl{stroke:var(--rule)}
.gchart .ax{font-size:11px;fill:var(--muted)}
.gchart .refd{stroke:var(--muted);stroke-dasharray:4 4;stroke-width:1.5}
.gchart .ld{fill:none;stroke:var(--dub);stroke-width:2.25}
.gchart .lo{fill:none;stroke:var(--opp, #c98200);stroke-width:2;opacity:.9}
.gchart .dm{fill:var(--dub)} .gchart .dx{fill:var(--card);stroke:var(--dub);stroke-width:1.3}
.gchart .pn{font-size:11px;fill:var(--ink)} .gchart .pn.off{opacity:.4} .gchart .pn.on{font-weight:700}
.gchart .lane{fill:var(--n)}
.gchart .future{fill:var(--n);opacity:.55}
.gchart .rule{stroke:var(--ink);stroke-opacity:.6}
.gchart .d1{fill:var(--dub);stroke:var(--card);stroke-width:2} .gchart .d2{fill:var(--opp, #c98200);stroke:var(--card);stroke-width:2}

.g2{display:grid;grid-template-columns:1fr 1.3fr;gap:8px}
.g2 .tile{cursor:default;min-height:64px} .g2 .tile .v{font-size:1.45rem}
.gchart .st{opacity:1;cursor:pointer} .gchart .st.off{opacity:.25}
.gchart .s2{fill:var(--g2)} .gchart .s1{fill:#6fa9bd} .gchart .s0{fill:#a3adb8} .gchart .s-1{fill:#e3a77c} .gchart .s-2{fill:var(--b2)} .gchart .sN{fill:#c3cbd3}
.gchart .tipb{stroke:none;filter:drop-shadow(0 1px 2px rgba(0,0,0,.3))} .gchart .tipb.mk{fill:var(--g2)} .gchart .tipb.ms{fill:var(--ink)}
.gchart .tipt{font-size:11.5px;font-weight:700;fill:#fff;white-space:pre} .gchart .tipb.ms + .tipt{fill:var(--bg)}
.gchart .bl{font-size:9.5px;font-weight:700} .gchart .b2,.gchart .b-2{fill:#fff} .gchart .b1,.gchart .b0,.gchart .b-1{fill:#15202b}
.tscroll{overflow-x:auto;padding:6px 0}
.ptbl.stk th:first-child,.ptbl.stk td:first-child{position:sticky;left:0;background:var(--card);z-index:1;padding-left:10px}
.ptbl .sb{font:inherit;color:inherit;background:none;border:0;padding:4px 0;cursor:pointer;white-space:nowrap}
.ptbl th[aria-sort] .sb{color:var(--ink)}
.ptbl td{white-space:nowrap}
.mlink{font:inherit;font-size:.78rem;color:var(--dub);background:none;border:0;text-decoration:underline;cursor:pointer;padding:6px}
.ins{list-style:none;margin:0;padding:10px 12px;background:var(--card);box-shadow:inset 0 0 0 1px var(--rule);border-radius:12px;display:flex;flex-direction:column;gap:5px}
.ins li{display:flex;gap:8px;align-items:baseline;font-size:.86rem;line-height:1.35}
.ins .id{flex:0 0 auto;width:9px;height:9px;border-radius:50%;transform:translateY(1px)}
.ins .id.t0{background:var(--muted);opacity:.5}
.chart .ml,.gchart .ml{fill:none;stroke:var(--opp);stroke-width:1.75;stroke-linejoin:round}
.chart .md{fill:var(--opp);stroke:var(--card);stroke-width:1.5}
.chart .md,.chart .ml,.chart .mz,.chart .ma,.gchart .ml,.gchart .mz,.gchart .ma{pointer-events:none} .chart .mt{font-size:9.5px;fill:var(--opp);font-weight:700}
.chart .mz,.gchart .mz{stroke:var(--opp);stroke-opacity:.35;stroke-dasharray:2 3}
.chart .ma,.gchart .ma{font-size:10px;fill:var(--opp);font-weight:600}
.mkey{display:inline-block;width:14px;height:3px;border-radius:2px;background:var(--opp);margin-right:5px;vertical-align:middle}
.smp{font-size:.7rem;text-transform:uppercase;letter-spacing:.04em;opacity:.75}
.agev{font-size:.72rem;color:var(--bar-muted)}
.hsticky{box-shadow:0 1px 0 var(--rule)}
.gro .gm{color:var(--muted);font-size:.8rem}
.frow.go{cursor:pointer;border-radius:0}
.frow.go:hover{background:var(--n)}
.frow .s small{display:block;font-size:.66rem;font-weight:500;color:var(--muted)}
.frow .chev{color:var(--muted);font-size:1.1rem;text-align:right}
.lrow .bw{position:relative;align-self:stretch;display:flex;align-items:center}
.lrow .avgl{position:absolute;top:-2px;bottom:-2px;border-left:1.5px dashed var(--ink);opacity:.7}
.frow .dd{text-align:right;font-weight:700;font-size:.8rem}
.frow.top{border-top:2px solid var(--ink)}
.ptbl td.dl{font-weight:700}
.lrow .val{text-align:right}
.lrow.me{background:var(--ink);color:var(--bg);font-weight:700} .lrow.me .n{color:var(--bg)} .lrow.me .b{background:var(--bg)}
.lrow.pair{box-shadow:inset 0 0 0 1.5px var(--ink);font-weight:700}
.ptbl{width:100%;border-collapse:collapse;font-size:.85rem;font-variant-numeric:tabular-nums}
.ptbl th{font-size:.72rem;color:var(--muted);font-weight:600;text-align:right;padding:4px 4px}
.ptbl td{padding:4px;text-align:right;border-top:1px solid var(--rule)}
.ptbl th:first-child,.ptbl td:first-child{text-align:left}
.ptbl .chip{min-width:3.6rem;font-size:.82rem;padding:3px 6px}
.note{font-size:.78rem;color:var(--muted);padding:0 2px;margin:6px 0 0}
@media (min-width:520px){.tile .v{font-size:1.3rem} .tile{min-height:66px} .ch{font-size:.8rem} .grid{gap:8px}}
@media (prefers-reduced-motion: reduce){.live-dot{animation:none}.tile{transition:none}}
</style>
